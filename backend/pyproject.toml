[project]
name = "proflearn-backend"
version = "0.1.0"
description = "ProfLearn Backend API & Worker"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic[email]>=2.10.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pgvector>=0.3.6",
    "argon2-cffi>=23.1.0",
    "pyjwt>=2.10.0",
    "pymupdf>=1.25.0",
    "tiktoken>=0.8.0",
    "boto3>=1.35.0",
    "botocore>=1.35.0",
    "mutagen>=1.47.0",
    "tenacity>=9.0.0",
    "structlog>=24.4.0",
    "slowapi>=0.1.9",
    "jinja2>=3.1.4",
    "python-multipart>=0.0.19",
    "aiosmtplib>=3.0.2",
    "openai>=1.57.0",
    "email-validator>=2.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "types-boto3>=1.35.0",
    "types-PyYAML>=6.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C4", "UP"]
ignore = ["B008", "E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
python_files = "test_*.py"
markers = [
    "ai_live: marks tests that require live OpenAI API keys (deselect with '-m \"not ai_live\"')",
]
